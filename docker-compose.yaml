version: '3.8'

services:
  order-service:
    build:
      context: ./OrderService
    container_name: order-service
    ports:
      - "9091:9091"
    depends_on:
      - notification-service

  notification-service:
    build:
      context: ./NotificationService
    container_name: notification-service
    ports:
      - "8082:8082" 
